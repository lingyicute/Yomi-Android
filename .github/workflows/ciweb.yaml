name: Web Version Ci

on:
  push:
  
permissions:   
  contents: write

jobs:
  build_web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cat .github/workflows/versions.env >> $GITHUB_ENV
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install nodejs -y
      - run: flutter pub get
      - name: Prepare web
        run: ./scripts/prepare-web.sh
      - name: Build Release Web
        run: flutter build web --dart-define=FLUTTER_WEB_CANVASKIT_URL=canvaskit/ --release --source-maps --base-href "/"
      - name: ls
        run: tree -a build/
      - name: Create archive
        run: tar -czf yomi-web.tar.gz build/web/
      - name: Upload Web Build
        uses: actions/upload-artifact@v4
        with:
          name: Web Build
          path: yomi-web.tar.gz

      - name: Delete old nightly release 
        run: gh release delete nightly-web --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish nightly release 
        run: |
          gh release create nightly-web \
            yomi-web.tar.gz \
            --title "Nightly Web Build" \
            --notes "auto build · ${GITHUB_SHA:0:7} · ${GITHUB_REF_NAME}" \
            --prerelease \
            --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
