name: Ci

on:
  push:

permissions:   
  contents: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  build_apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: cat .github/workflows/versions.env >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'zulu'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - run: flutter build apk --release

      - name: Prepare per-ABI APKs
        run: |
          mkdir -p build/android
          for abi in armeabi-v7a arm64-v8a x86_64; do
            cp build/app/outputs/apk/release/app-${abi}-release.apk build/android/yomi-${abi}.apk
          done
          ls -la build/android

      - name: Delete old nightly release 
        run: gh release delete nightly --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish nightly release 
        run: |
          gh release create nightly \
            build/android/yomi-armeabi-v7a.apk \
            build/android/yomi-arm64-v8a.apk \
            build/android/yomi-x86_64.apk \
            --title "Nightly Build" \
            --notes "auto build · ${GITHUB_SHA:0:7} · ${GITHUB_REF_NAME}" \
            --prerelease \
            --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Release
          path: build/android/yomi-*.apk

